name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

# Never cancel a release if another tag is pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { console.error('Tag does not match package version: ' + p.version); process.exit(1); }"
      # TODO: Remove when the Ink 8 migration lockfile has been committed.
      - name: Temporarily reconcile the migration lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:agents
      - run: npm test
      - run: npm run build
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm publish --access public --provenance
