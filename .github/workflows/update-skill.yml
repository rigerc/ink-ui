name: Update Ink UI screen design skill

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'AGENTS.md'
      - 'docs/**'
      - 'skills/ink-ui-screen-design/**'
      - 'scripts/sync-skill.mjs'
      - '.github/workflows/update-skill.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-ink-ui-skill
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Regenerate factual API reference
        run: npm run update:skill
      - name: Verify deterministic output
        run: node scripts/sync-skill.mjs --check-generated
      - name: Lint updater
        run: npm run lint -- --format stylish
      - name: Audit design references (advisory for this update PR)
        id: audit
        continue-on-error: true
        run: npm run check:skill
      - name: Open or update proposed skill reference PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SKILL_AUTOMATION_TOKEN || github.token }}
          branch: automation/update-ink-ui-skill
          base: main
          delete-branch: true
          add-paths: skills/ink-ui-screen-design/references/generated-api.md
          commit-message: 'docs: refresh generated Ink UI skill API reference'
          title: 'docs: refresh generated Ink UI skill reference'
          body: |
            Automated update of the source-derived Ink UI skill API reference.

            - Reconciles public exports and token families with the current source.
            - Updates package version and peer dependency metadata.
            - Preserves the authored design principles for human review.

            **Authored-reference audit:** ${{ steps.audit.outcome }}.
            A failing audit means a component reference or local link needs
            a manual correction before this PR can be merged.

            Generated by the Update Ink UI screen design skill workflow.
