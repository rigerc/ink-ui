name: Temporary lockfile repair

on:
  push:
    branches: [chore/ci-starter-hardening-20261028]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild the lockfile against package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Update vulnerable transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Audit generated dependency graph
        run: npm audit --audit-level=moderate
      - name: Export corrected lockfile
        shell: bash
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const s = readFileSync("package-lock.json", "utf8");
            for (let i = 0; i < s.length; i += 2000) {
              console.log("LOCKFILE_REPAIR_PART:" + String(i / 2000).padStart(5, "0") + ":" + JSON.stringify(s.slice(i, i + 2000)));
            }
            console.log("LOCKFILE_REPAIR_DONE:" + s.length);
          '
