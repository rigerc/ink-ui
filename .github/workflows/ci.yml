name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only cancel superseded PR runs, never a push-to-main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Linux / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint (list files and report diagnostics)
        run: |
          echo "Oxlint version: $(npx oxlint --version)"
          echo 'Files selected for linting:'
          npm run lint -- --debug files
          echo 'Running lint:'
          npm run lint -- --format stylish
          echo 'Lint passed.'
      - name: Check formatting of changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Legacy source has not yet received its initial formatting pass.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- src scripts tools > "$RUNNER_TEMP/changed-sources"
          mapfile -d '' -t changed < "$RUNNER_TEMP/changed-sources"
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs)
                files+=("$file")
                ;;
            esac
          done
          if (( ${#files[@]} )); then
            printf 'Checking %s\n' "${files[@]}"
            ./node_modules/.bin/oxfmt --check "${files[@]}"
          else
            echo 'No TypeScript or JavaScript source files changed.'
          fi
      - run: npm run typecheck
      - run: npm run check:agents
      - run: npm run check:skill
      - run: npm test
      - name: Test Pill with NO_COLOR inherited
        run: npx vitest run src/components/pill.test.tsx
        env:
          NO_COLOR: '1'
      - run: npm run build
      - name: Verify published package contents
        shell: bash
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))[0];
            const files = new Set(manifest.files.map((file) => file.path));
            for (const path of ["dist/index.js", "dist/index.d.ts", "AGENTS.md"]) {
              if (!files.has(path)) throw new Error("Missing from npm package: " + path);
            }
          '
