name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only cancel superseded PR runs, never a push-to-main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck and agent guidance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # TODO: Remove this once package-lock.json is regenerated and committed
      # for the Ink 8 / React 19.3 migration; npm ci alone currently rejects it.
      - name: Temporarily reconcile the migration lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:agents

  tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # See the lockfile migration TODO in the quality job.
      - name: Temporarily reconcile the migration lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify published package contents
        if: runner.os == 'Linux' && matrix.node == '24'
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))[0];
            const files = new Set(manifest.files.map((file) => file.path));
            for (const path of ["dist/index.js", "dist/index.d.ts", "AGENTS.md"]) {
              if (!files.has(path)) throw new Error("Missing from npm package: " + path);
            }
          '
